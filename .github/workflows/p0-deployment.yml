name: P0 legacy deployment validation

on:
  push:
    branches:
      - 'p0/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  deployment-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test safe apply verify rollback cycle
        run: pytest -q tests/test_deploy.py tests/test_deployment_manifest.py
      - name: Validate audited upstream Git blob SHAs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/upstream_validate.py
      - name: Upload upstream validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sha-report-${{ github.run_id }}
          path: validation/upstream-sha-report.json
          if-no-files-found: warn
          retention-days: 90
