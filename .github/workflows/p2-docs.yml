name: P2 documentation validation

on:
  push:
    branches:
      - main
      - 'p2/**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Validate editorial examples and invariants
        run: pytest -q tests/test_documentation_pack.py
      - name: Detect public api.bnf.fr documentation drift
        run: python scripts/verify_public_documentation_contract.py
      - name: Upload documentation drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-documentation-report-${{ github.run_id }}
          path: validation/public-documentation-report.json
          if-no-files-found: warn
          retention-days: 90
