[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bnf-api-p0"
version = "0.1.3"
description = "Correctifs P0 et validation des scripts Gallica référencés par api.bnf.fr"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
